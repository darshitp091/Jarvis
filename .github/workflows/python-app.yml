# GitHub Actions CI Workflow for JARVIS Voice & Vision Assistant
name: JARVIS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    # This job invokes python directly rather than through pytest, so it does
    # not get pytest.ini's `pythonpath = src`. Without this, both import checks
    # below fail with ModuleNotFoundError: No module named 'jarvis'.
    env:
      PYTHONPATH: src

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Core Dependencies
      run: |
        python -m pip install --upgrade pip
        # The ruff floor repeats requirements-test.txt's; this job installs a
        # short list rather than that file, because ruff is the only tool it
        # needs from it and the rest (numpy, sounddevice, pytest) is the Linux
        # job's business. Keep the two floors in step.
        pip install "ruff>=0.12" pyyaml loguru requests ollama

    - name: Lint
      # Was: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      #      --exclude=jarvis_env,venv,.git,scratch
      #
      # Swapped for ruff because the flake8 gate did not do the one job it was
      # written for. `--select=E9,F63,F7,F82` covers F823 by prefix, and against
      # main.py before commit 661ff99 flake8 reported 0 while ruff reported
      # `main.py:2351:62: F823` -- a real UnboundLocalError, live in the
      # application, sitting under a gate that existed to catch exactly that.
      #
      # No flags here on purpose. Rule set, exclusions, target version and line
      # length all come from [tool.ruff] in pyproject.toml, so this command
      # means the same thing on a developer's machine as it does here. A gate
      # whose configuration lives in a YAML string is a gate nobody can
      # reproduce locally, and that is how the flake8 blind spot survived.
      #
      # The enforced set is wider than flake8's was (E4,E7,E9,F,B against
      # syntax-errors-and-undefined-names) and still passes with no code
      # changes. pyproject.toml carries the ignore list, each rule with its
      # measured violation count, and the ratchet instructions.
      run: ruff check . --output-format=full

    - name: Verify Core Imports & Intent Routing Engine
      run: |
        python -X utf8 -c "from jarvis.core.intent_router import IntentRouter; router = IntentRouter(); print('✅ IntentRouter initialized successfully!')"

    - name: Verify File Manager & OneDrive Resolver Engine
      run: |
        python -X utf8 -c "from jarvis.skills.file_manager import FileManager; fm = FileManager(); print('✅ FileManager & OneDrive Resolver initialized successfully!')"

  # Proves the suite has no Windows, GPU, or hardware dependency: this job
  # installs requirements-test.txt and nothing else. The Windows job above is
  # what covers the pywin32-dependent skill imports; the two are complementary
  # and neither replaces the other.
  test-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Audio Shared Libraries
      # sounddevice and soundfile dlopen PortAudio and libsndfile at import
      # time, so `import core.tts_engine` fails without them. No audio device is
      # opened -- the TTS tests monkeypatch every playback call -- so no sound
      # server is needed, only the shared objects.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libportaudio2 libsndfile1

    - name: Install Test Dependencies Only
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt

    - name: Run Test Suite With Coverage Gate
      # Lowered 20 -> 5, and the drop is not a regression in testing.
      #
      # The denominator was wrong. `source = .` discovered never-imported files
      # only inside importable packages, and services/ was the only directory
      # with an __init__.py, so 66 of 81 source modules were absent from the
      # measurement. Naming the source tree explicitly grows the denominator
      # from 6,690 statements to 17,961.
      #
      # Covered statements barely moved: 1,721 then, 1,732 now, the difference
      # being the package __init__.py files that an import executes. Exactly the
      # same tests exercise exactly the same lines; 25.72% divided them by 6,690
      # statements, which is 37% of the real total. 9.64% is the same fact,
      # honestly divided.
      #
      # --cov-precision=2 is load-bearing, not cosmetic. pytest-cov decides the
      # exit code on `round(total, precision) < fail_under` but formats the
      # printed message from the unrounded value, so at the default precision 0
      # this exact suite against --cov-fail-under=10 prints
      # "FAIL Required test coverage of 10% not reached. Total coverage: 9.64%"
      # and exits 0 -- a green build with FAIL on screen. Measured on
      # pytest-cov 7.1.0; the same command with --cov-precision=2 exits 1. The
      # gate of 5 is not in that dead band, but 10 is the next ratchet a 9.64%
      # reading invites, so the flag lands before the ratchet does.
      #
      # 5 leaves 4.64pp of headroom. Ratchet upward as tests land; never lower
      # it to make a red build pass.
      run: pytest --cov --cov-report=term-missing --cov-precision=2 --cov-fail-under=5
