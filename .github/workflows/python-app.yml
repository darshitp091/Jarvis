# GitHub Actions CI Workflow for JARVIS Voice & Vision Assistant
name: JARVIS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pyyaml loguru requests ollama

    - name: Lint for Critical Syntax Errors
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=jarvis_env,venv,.git,scratch

    - name: Verify Core Imports & Intent Routing Engine
      run: |
        python -X utf8 -c "from core.intent_router import IntentRouter; router = IntentRouter(); print('✅ IntentRouter initialized successfully!')"

    - name: Verify File Manager & OneDrive Resolver Engine
      run: |
        python -X utf8 -c "from skills.file_manager import FileManager; fm = FileManager(); print('✅ FileManager & OneDrive Resolver initialized successfully!')"

  # Proves the suite has no Windows, GPU, or hardware dependency: this job
  # installs requirements-test.txt and nothing else. The Windows job above is
  # what covers the pywin32-dependent skill imports; the two are complementary
  # and neither replaces the other.
  test-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Audio Shared Libraries
      # sounddevice and soundfile dlopen PortAudio and libsndfile at import
      # time, so `import core.tts_engine` fails without them. No audio device is
      # opened -- the TTS tests monkeypatch every playback call -- so no sound
      # server is needed, only the shared objects.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libportaudio2 libsndfile1

    - name: Install Test Dependencies Only
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt

    - name: Run Test Suite With Coverage Gate
      # Ratcheted 15 -> 20. The router characterization tests execute ~1,400
      # previously-unexercised lines, moving the measured total from 20.45% to
      # 25.72%; core/intent_router.py now reports 56% where it was absent from
      # the denominator entirely. 20 leaves 5.72pp of headroom, so unlike the
      # first gate this one is a genuine round-down rather than a floor squeezed
      # against the measurement.
      #
      # Deliberately NOT ratcheted to 25 even though 25.72% would permit it:
      # 0.72pp is inside ordinary variation, and a gate that tight fails on
      # unrelated changes. Rounding down exists to buy headroom, so when the
      # measurement lands just above a bucket edge the correct move is the
      # bucket below. Same call was made at 20.45% -> 15.
      #
      # Still 20 rather than the audit's 40, and still never measured on Linux.
      # Ratchet upward as tests land; never lower it to make a red build pass.
      run: pytest --cov=. --cov-report=term-missing --cov-fail-under=20
