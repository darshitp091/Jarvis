[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "1.0.0"
description = "A high-performance, privacy-first, Stark-inspired desktop voice & vision AI assistant for Windows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Darshit Patel", email = "darshitp091@gmail.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pyyaml",
    "loguru",
    "requests",
    "ollama",
    "sounddevice",
    "numpy",
    "pyautogui",
    # pywin32 has no Linux wheel. Unmarked, it makes `pip install -e .` fail
    # outright on the ubuntu CI runner -- which is why the Linux job installs
    # requirements-test.txt instead of the project. The marker is what lets
    # that job install the project itself.
    "pywin32; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/darshitp091/Jarvis"
"Bug Tracker" = "https://github.com/darshitp091/Jarvis/issues"
"Source Code" = "https://github.com/darshitp091/Jarvis"

[tool.setuptools.packages.find]
where = ["src"]

# There is deliberately no [project.scripts] entry and no py-modules = ["main"].
# main.py sits at the repository root while the packages sit under src/, and
# `where = ["src"]` makes src/ the package root -- so py-modules looks for
# src/main.py and does not find it. Tested rather than assumed: with both keys
# present, setuptools does not reject the configuration, it accepts it and
# installs a jarvis.exe that dies on invocation with
# `ModuleNotFoundError: No module named 'main'`. A command that ships broken is
# worse than one that is absent.
#
# `python main.py` is unaffected -- it resolves through main.py's own sys.path
# bootstrap, not through an install, and it is the entry point SETUP.md
# documents. The console script comes back when main.py is decomposed and a
# real jarvis.__main__ exists to point at.

[tool.ruff]
# Every setting here is pinned rather than left to ruff's default, because the
# default is not a fixed thing: ruff's own docs say the default select is
# `E4,E7,E9,F`, and `ruff check` on this repo with no config emitted BLE001,
# I001, S110 and RUF010 -- none of which are in that set, and with no config
# file anywhere on the machine to explain it. If CI and a developer's checkout
# can disagree about what the linter even checks, the gate is theatre. So the
# rule set lives here, in the repo, and `ruff check .` means the same thing
# everywhere.
target-version = "py310"   # matches requires-python; do not let ruff infer it
line-length = 100

# Not the test venv, not a vendored env, not scratch work. Mirrors the
# --exclude list the CI lint step used when it ran flake8.
extend-exclude = ["jarvis_env", "venv", "scratch", ".superpowers"]

[tool.ruff.lint]
# The enforced set. This is deliberately wider than the flake8 gate it replaced
# (`--select=E9,F63,F7,F82`, i.e. syntax errors and undefined names) and yet
# still passes with zero code changes -- measured, not hoped. `B` is
# flake8-bugbear, which ruff implements natively; it is the part that earns its
# place, catching mutable default arguments (B006), assert-on-a-tuple (B004),
# and useless expressions (B018), all of which currently measure zero and are
# now held there.
select = ["E4", "E7", "E9", "F", "B"]

# THE BACKLOG, AND THE RATCHET.
#
# These are not "rules we disagree with" -- they are rules this codebase does
# not pass yet. Each carries the count measured at the commit that added this
# block, so the next person can tell progress from drift. Tightening is a
# one-line edit: fix a rule's violations, delete its line, and the gate holds
# the improvement permanently. That is the whole mechanism; there is nothing
# else to remember.
#
# Deleting a line without fixing the violations turns CI red, which is the
# point. Adding a line is how a rule regresses, so an added line should have
# a reason next to it.
ignore = [
    # Style backlog. Large, mechanical, and entangled with main.py's size --
    # these mostly go away when main.py is decomposed, so fixing them by hand
    # first would be work thrown away twice.
    "E702",  # 99 -- multiple statements on one line (semicolon)
    "E402",  # 73 -- import not at top of file; main.py bootstraps sys.path first
    "E701",  # 47 -- multiple statements on one line (colon)
    "F401",  #  52 -- unused import. NOT auto-fixable here: some are re-exports
             #        and some guard optional dependencies, so a blind --fix
             #        would delete working behaviour.
    "F541",  # 32 -- f-string with no placeholders
    "F841",  # 13 -- assigned and never used
    "E741",  #  6 -- ambiguous name (l/I/O)
    "B007",  # 14 -- unused loop control variable

    # Real defects, deferred with a reason. Each needs its own commit and its
    # own verification; none is a lint cleanup.
    "B023",  #  2 -- main.py:2882 and :2888. `def run_lab` closes over `task`,
             #       assigned at 2869 inside `for attempt in range(...)` at
             #       2424 -- a loop whose body is 1,379 lines, which is why
             #       nobody noticed it was a loop. Classic late binding: the
             #       thread reads `task` when it runs, not when it was created.
             #       Fixing it means touching a threaded retry path that no
             #       test covers, so it waits for a test.
    "B905",  #  3 -- zip() without strict=. src/jarvis/skills/network_mapper.py:73
             #       and two in tests/test_command_dispatch.py. strict=True is
             #       the right answer in all three, but it turns a silent
             #       truncation into an exception -- a behaviour change, not a
             #       formatting one.
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into module internals on purpose; that is what a
# characterization test is for.
"tests/*" = ["E501"]

