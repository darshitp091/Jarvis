[pytest]
# Collect only tests/. Without this, a bare `pytest` at the repo root also picks up
# scratch/test_*.py, which import main.py and open the mic, camera, and LLM clients,
# so the run appears to hang instead of finishing.
testpaths = tests
norecursedirs = scratch jarvis_env node_modules bin models whisper-small-hinglish-finetuned obsidian_vault .git __pycache__
addopts = -q
# src-layout: the jarvis package lives under src/, which is not importable by
# default. `pythonpath` is a pytest ini option (7.0+); requirements-test.txt
# floors pytest at 8.3, so it is always available.
pythonpath = src
